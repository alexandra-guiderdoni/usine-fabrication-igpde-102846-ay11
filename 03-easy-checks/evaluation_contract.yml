schema_version: "1.0"
contract_id: "igpde-session-3-easy-checks"
title: "Contrat d'évaluation - Exercice Les 13 points de contrôle rapides du W3C"
course:
  code: "102846"
  section: "3. Les 13 points de contrôle rapides du W3C"
site:
  name: "Formation 102846 - Accessibilité numérique"
  baseline: "Mission d'audit pédagogique - Points de contrôle rapides"
  root: "docs/"
versions:
  inaccessible:
    path: "site-inaccessible/"
    role: "Site à auditer"
    visible_help: false
  help:
    path: "site-aide-correction/"
    role: "Même site avec guidage pédagogique"
    visible_help: true
    help_position: "Haut de page"
    help_component: "Groupe d'accordéons DSFR"
  accessible:
    path: "site-accessible/"
    role: "Ressources sur l'accessibilité numérique"
    visible_help: false
diagnostic_fields:
  constat: "Ce qui est observé concrètement."
  mise_en_conformite: "Ce que l'équipe doit corriger."
  preuve_ecart: "URL, capture, sélecteur ou extrait permettant de retrouver l'écart."
exercise_rules:
  format: "Binômes"
  duration_minutes: 30
  pages_per_group: 3
  principle: "Pour une page donnée, un seul écart correctement prouvé suffit à documenter le point."
  bonus_principle: "Les occurrences supplémentaires sont optionnelles et servent à enrichir la restitution collective."
  scope_warning: "Pré-diagnostic pédagogique, pas audit RGAA complet."
tools:
  automatic:
    - "WAVE"
    - "ANDI"
    - "HeadingsMap"
    - "Web Developer"
  manual:
    - "Clavier"
    - "Zoom navigateur 200 %"
    - "DevTools"
    - "Revue humaine"
  contrast:
    - "WebAIM Contrast Checker"
    - "Colour Contrast Analyser"
  optional_screen_reader:
    - "NVDA"
    - "VoiceOver"
shared_dsfr_components:
  - "En-tête"
  - "Navigation principale"
  - "Liens d'évitement"
  - "Pied de page"
  - "Fil d'Ariane"
  - "Lien"
source_documents:
  prd: "03-easy-checks/exercice-site-easy-checks-spec.md"
  dsfr_links: "03-easy-checks/dsfr-component-links.md"
  dsfr_rules: "03-easy-checks/dsfr-implementation-rules.md"
  grid_md: "03-easy-checks/grille-audit-easy-checks.md"
  grid_xlsx: "03-easy-checks/grille-audit-easy-checks.xlsx"

pages:
  - id: "ec01-images"
    number: 1
    title: "Contrôler les images avant publication"
    card_description: "Rôle des images et alternatives textuelles"
    realistic_context: "Annonce d'une nouvelle ressource RGAA illustrée par une image informative."
    easy_check:
      number: 1
      name: "Texte alternatif des images"
    expected_minimal_finding: "Au moins une image n'a pas d'alternative adaptée à son rôle réel."
    minimal_proof: "Capture WAVE/ANDI ou extrait HTML montrant alt absent, vide ou inadapté sur l'image concernée."
    detection:
      - "WAVE"
      - "ANDI"
      - "Inspection HTML"
    inaccessible_errors:
      - "Image informative sans alternative ou avec alt vide."
      - "Image décorative trop bavarde."
      - "Image-lien courriel avec alternative qui décrit l'image au lieu d'indiquer l'action."
      - "Lien composite SMS dont l'icône décorative a une alternative qui ajoute du bruit."
    bonus_occurrences:
      - "Image décorative bavarde."
      - "Image-lien dont l'alternative décrit l'image au lieu de l'action."
      - "Lien composite dont l'icône ajoute du bruit dans le nom accessible."
    do_not_penalize:
      - "Image purement décorative avec alt vide."
    accessible_correction: "Image informative : alternative courte reprenant l'information. Image décorative : alt vide. Image-lien courriel : alternative indiquant l'action. Lien composite SMS : icône décorative avec alt vide si le texte visible suffit."
    help:
      hint: "Niveau 1 - Observer le rôle de chaque image et la structure HTML des liens. Identifiez les 4 cas : image informative, image décorative, lien image pur et lien composite."
      problem: "Niveau 2 - Appliquer la bonne règle. Une image informative doit porter l'information utile. Une image décorative doit être ignorée. Une image seule dans un lien doit donner l'action ou la destination du lien. Dans un lien composite, si le texte visible suffit, l'icône doit rester silencieuse."
      findings_intro: "Indices ciblés par cas :"
      findings:
        - "Image informative : le schéma de méthodologie d'audit n'a pas d'attribut alt."
        - "Image décorative : le séparateur visuel a un alt trop long alors qu'il devrait être ignoré."
        - "Lien image courriel : l'enveloppe est le seul contenu du lien. Le test RGAA 6.1.2 attend un intitulé qui donne la fonction et la destination."
        - "Lien composite SMS : le texte visible « Envoyer un SMS » donne déjà l'action. Dans le cas RGAA 6.1.3, l'icône n'apporte pas d'information supplémentaire."
      fix: "Niveau 3 - Corriger chaque cas indépendamment. Les retours doivent isoler le cas fautif pour éviter de mélanger lien image et lien composite."
      fixes_intro: "Messages de correction ciblés :"
      fixes:
        - "Image informative : le schéma n'a pas d'alternative. Ajouter un alt court qui reprend l'information portée par l'image, sans légende inutile."
        - "Image décorative : le séparateur a un alt trop verbeux. Vider l'attribut alt pour qu'il soit ignoré par les technologies d'assistance."
        - "Courriel : l'alternative du lien image décrit le visuel au lieu de donner la fonction du lien. Remplacer par un alt d'action, par exemple « Envoyer un courriel au ministère »."
        - "SMS : l'icône est dans un lien composite dont le texte donne déjà l'action. Vider l'attribut alt de cette image décorative pour éviter une redondance vocale."
    dsfr_components:
      - "Carte"
      - "Lien"
      - "Contenu médias"

  - id: "ec02-page-title"
    number: 2
    title: "Résultats de recherche RGAA"
    realistic_context: "Page de résultats de recherche pour des ressources RGAA."
    easy_check:
      number: 2
      name: "Titre de page"
    expected_minimal_finding: "Le titre de page ne permet pas d'identifier précisément la page ou son état."
    minimal_proof: "Onglet navigateur ou extrait title montrant un titre absent, générique, dupliqué ou mal ordonné."
    detection:
      - "Onglet navigateur"
      - "Code source"
      - "WAVE"
    inaccessible_errors:
      - "Titre non informatif de type Sans titre."
      - "Titre identique sur plusieurs pages de résultats."
      - "Information spécifique placée trop tard après le nom long du ministère."
    bonus_occurrences:
      - "Titre absent ou intitulé Sans titre."
      - "Pagination absente du titre."
      - "Requête de recherche absente."
      - "Nom du ministère placé avant l'information spécifique."
    do_not_penalize:
      - "Titre long si l'information spécifique est présente en premier."
    accessible_correction: "Titre unique, spécifique et ordonné du particulier vers le général, par exemple Recherche \"RGAA\" - Page 2/3 - Formation 102846 - Accessibilité numérique."
    help:
      hint: "Regarder l'onglet du navigateur, le title HTML et le résultat WAVE. La page affiche déjà la requête, le tri, la page courante et le nombre de résultats : ces informations doivent aussi guider le titre."
      problem: "L'utilisateur ne sait pas quelle page ou quel état est ouvert, ce qui gêne la navigation entre onglets, historique et résultats. Sur une page de recherche, le titre doit reprendre la requête et la pagination utiles."
      findings_intro: "Les trois points à vérifier sont :"
      findings:
        - "Titre générique : la version à auditer affiche un titre de type « Sans titre » dans l'onglet."
        - "Contexte de recherche : la page visible indique la requête « RGAA », la page 2 sur 3 et le tri, mais ces informations ne sont pas reprises dans le titre."
        - "Ordre de lecture : l'information spécifique doit arriver avant le nom long du ministère pour rester utile dans un onglet ou un lecteur d'écran."
      fix: "Rendre le titre unique, ajouter le contexte utile et placer l'information spécifique en premier : requête, page courante, nombre total de pages, puis nom du site."
      fixes_intro: "Corrections attendues :"
      fixes:
        - "Remplacer le titre générique par un titre unique."
        - "Inclure la requête et la pagination utiles."
        - "Ordonner le titre du particulier vers le général, par exemple Recherche \"RGAA\" - Page 2/3 - Formation 102846 - Accessibilité numérique."
    dsfr_components:
      - "Barre de recherche"
      - "Lien"
      - "Carte"

  - id: "ec03-headings"
    number: 3
    title: "Guide du RGAA"
    realistic_context: "Page explicative sur le RGAA et ses ressources."
    easy_check:
      number: 3
      name: "Titres et hiérarchie"
    expected_minimal_finding: "Un ou plusieurs textes visuellement présentés comme titres ne sont pas balisés comme titres, ou une balise de titre est utilisée pour une simple mise en valeur."
    minimal_proof: "HeadingsMap/WAVE ou extrait HTML montrant les faux titres en paragraphes, ou le titre détourné pour la présentation."
    detection:
      - "HeadingsMap"
      - "WAVE"
      - "DevTools"
    inaccessible_errors:
      - "Plusieurs titres visuels non balisés."
      - "Balise de titre détournée pour un effet visuel."
      - "Titre de niveau 1 utilisé au milieu du contenu, à analyser avec nuance."
    bonus_occurrences:
      - "Comparer le plan visuel et le plan technique."
      - "Repérer un titre non pertinent."
      - "Qualifier le h1 interne comme incohérence de plan, sans perdre les deux erreurs principales."
    do_not_penalize:
      - "Plusieurs h1 si la hiérarchie reste cohérente au sens RGAA."
    accessible_correction: "Titre visuel balisé avec un élément de titre natif ou `role=\"heading\"`/`aria-level` si nécessaire ; balise de titre réservée aux vrais titres ; hiérarchie globalement pertinente et niveaux continus par bonne pratique."
    help:
      hint: "Afficher le plan de titres avec HeadingsMap, puis le comparer au plan visuel. Chercher les titres visibles qui n'apparaissent pas dans le plan, et les titres du plan qui ne correspondent pas à une vraie rubrique."
      problem: "Le plan technique peut être absent, pollué ou mal interprété ; la navigation par titres devient inefficace. Le h1 interne est volontairement très incohérent : il se discute dans le plan de titres, mais ne doit pas masquer les erreurs de sémantique."
      findings_intro: "Indices ciblés par cas :"
      findings:
        - "Faux titres : « Comprendre le RGAA », « Avant de publier », « Ressources pour les contributeurs » et « À retenir pour l'équipe » sont visuellement présentés comme titres, mais codés avec des paragraphes."
        - "Titre détourné : « Publication urgente avant vendredi » est codé en h3 alors qu'il s'agit d'une mise en valeur éditoriale."
        - "Incohérence de plan : « Repères déjà présents » revient au niveau h1 au milieu du contenu, alors qu'il dépend visuellement de la rubrique Ressources."
        - "Bonnes pratiques déjà présentes : les accès rapides, le fil d'Ariane et les zones principales ne compensent pas les titres mal structurés."
      fix: "Identifier les vrais titres, vérifier leur sémantique, repérer les titres utilisés pour la présentation et qualifier les sauts de niveau avec nuance."
      fixes_intro: "Messages de correction ciblés :"
      fixes:
        - "Faux titres : remplacer chaque paragraphe stylé par un vrai titre de rubrique adapté au niveau attendu, ou retirer le style de titre si le texte n'ouvre pas une section."
        - "Titre détourné : remplacer le h3 de mise en valeur par un paragraphe, éventuellement avec strong et une classe CSS."
        - "Niveau incohérent : redescendre « Repères déjà présents » au niveau attendu dans la rubrique Ressources."
    dsfr_components:
      - "Lien"
      - "Accordéon"
      - "Mise en avant"

  - id: "ec04-contrast"
    number: 4
    title: "Charte de publication"
    realistic_context: "Page décrivant les règles de publication des contenus accessibles."
    easy_check:
      number: 4
      name: "Contraste des couleurs"
    expected_minimal_finding: "Au moins un texte, lien, bouton ou statut présente un contraste insuffisant."
    minimal_proof: "Mesure CCA/WebAIM/WAVE avec couleurs et ratio inférieur au seuil attendu."
    detection:
      - "WebAIM Contrast Checker"
      - "Colour Contrast Analyser"
      - "WCAG Contrast Checker"
      - "Vispero Color Contrast Checker"
      - "WAVE"
    inaccessible_errors:
      - "Texte courant gris clair sur blanc."
      - "Lien ou bouton d'action trop pâle."
      - "Information de statut transmise par une couleur faible."
    bonus_occurrences:
      - "Texte gris clair."
      - "Bouton pâle."
      - "Statut transmis par couleur faible."
    do_not_penalize:
      - "Usage d'une couleur DSFR conforme et information de statut aussi disponible en texte ou icône nommée."
    accessible_correction: "Ratio conforme : 4,5:1 pour texte normal ; 3:1 pour texte large et composants."
    help:
      hint: "Mesurer un texte, un lien ou un bouton avec un outil de contraste."
      problem: "La lecture ou l'identification devient difficile pour les personnes malvoyantes, en forte luminosité ou sur écran médiocre."
      findings_intro: "Les trois familles d'éléments à mesurer sont :"
      findings:
        - "Texte courant : le paragraphe gris clair sur fond blanc doit être mesuré, pas jugé à l'oeil."
        - "Actions : le lien et le bouton pâles peuvent devenir difficiles à distinguer de leur arrière-plan."
        - "Statut : l'information de validation ne doit pas dépendre d'une couleur peu contrastée."
      fix: "Mesurer, ne pas juger à l'oeil, et ne pas transmettre une information uniquement par une couleur peu contrastée."
      fixes_intro: "Corrections attendues :"
      fixes:
        - "Utiliser des couleurs DSFR dont les contrastes sont conformes aux seuils attendus."
        - "Vérifier 4,5:1 pour le texte courant et 3:1 pour les textes larges, composants et informations visuelles."
        - "Rendre le statut compréhensible par le texte, pas uniquement par une couleur."
    dsfr_components:
      - "Mise en avant"
      - "Alerte"
      - "Lien"
      - "Bouton"
      - "Badge"

  - id: "ec05-skiplinks"
    number: 5
    title: "Accès rapide aux contenus"
    realistic_context: "Page longue avec menu, recherche et contenu principal."
    easy_check:
      number: 5
      name: "Lien d'évitement"
    expected_minimal_finding: "Le lien d'évitement vers le contenu principal est absent, invisible au focus ou non fonctionnel."
    minimal_proof: "Test clavier au premier Tab, puis activation du lien et vérification de l'ancre cible."
    detection:
      - "Clavier"
      - "Premier appui sur Tab"
      - "Vérification de l'ancre cible"
    inaccessible_errors:
      - "Lien d'évitement absent."
      - "Lien présent mais invisible au focus."
      - "Lien présent mais cible d'ancre invalide ou inexistante."
    bonus_occurrences:
      - "Lien vers menu ou pied de page cassé."
      - "Cible mal orthographiée."
    do_not_penalize:
      - "Composant DSFR masqué hors écran par défaut s'il apparaît bien au focus."
    accessible_correction: "Utiliser le composant DSFR Liens d'évitement : bloc placé tout en haut de page, avant l'en-tête ; navigation aria-label Accès rapide ; liste de liens simples ; premier lien vers le contenu principal ; ancres valides."
    help:
      hint: "Appuyer une fois sur Tab au chargement de la page. Vérifier ensuite que le lien affiché est visible, compréhensible et activable sans souris."
      problem: "L'utilisateur clavier traverse toute la navigation ou active un raccourci qui ne mène pas au contenu principal. Il croit gagner du temps, mais reste bloqué dans l'en-tête ou arrive sur une cible inexistante."
      findings_intro: "Les trois erreurs à rechercher sont :"
      findings:
        - "Visibilité : le bloc d'accès rapide doit apparaître dès le premier Tab."
        - "Cible : le lien vers le contenu doit pointer vers un identifiant réellement présent dans la page."
        - "Activation : après validation, l'utilisateur doit arriver sur la zone principale, sans rester dans l'en-tête."
      fix: "Implémenter le composant DSFR Liens d'évitement, vérifier qu'il apparaît au focus et tester que chaque cible existe et fonctionne."
      fixes_intro: "Corrections attendues par type de cas :"
      fixes:
        - "Placer le composant Liens d'évitement tout en haut de page, avant l'en-tête."
        - "Utiliser une navigation avec aria-label Accès rapide et des liens simples."
        - "Faire pointer le premier lien vers l'identifiant du contenu principal, ici #contenu."
    dsfr_components:
      - "Liens d'évitement"
      - "En-tête"
      - "Navigation principale"
      - "Pied de page"
    dsfr_required_references:
      code: "https://www.systeme-de-design.gouv.fr/version-courante/fr/composants/liens-d-evitement/code-des-liens-d-evitement"
      accessibility: "https://www.systeme-de-design.gouv.fr/version-courante/fr/composants/liens-d-evitement/accessibilite-des-liens-d-evitement"

  - id: "ec06-keyboard-focus"
    number: 6
    title: "Parcours clavier"
    realistic_context: "Page avec cartes de ressources, boutons d'action et accordéons d'information."
    easy_check:
      number: 6
      name: "Focus et navigation clavier"
    expected_minimal_finding: "Le focus clavier n'est pas visible sur au moins un composant interactif, ou la modale de publication ouverte au clavier piège l'utilisateur."
    minimal_proof: "Parcours Tab / Shift+Tab montrant le composant focusable sans indicateur visible, les liens d'action secondaires sautés par le clavier, ou la modale ouverte sans sortie clavier standard."
    detection:
      - "Clavier"
      - "Tab"
      - "Shift+Tab"
      - "ANDI"
    inaccessible_errors:
      - "Liens d'action secondaires activables à la souris mais absents de l'ordre de tabulation."
      - "Focus visible supprimé sur un bouton."
      - "Focus visible supprimé sur une carte cliquable."
      - "Focus visible supprimé ou très peu perceptible sur un accordéon DSFR mal surchargé."
      - "Bouton Publier la session atteignable au clavier, mais la modale de publication piège ensuite le clavier : Tab reste bloqué et Échap ne referme pas la fenêtre."
    bonus_occurrences:
      - "Bouton, carte cliquable ou accordéon touché par la même surcharge CSS."
      - "Liens visibles mais absents du parcours Tab."
      - "Modale non refermable au clavier alors que le motif DSFR attend Échap et une fermeture focusable."
    do_not_penalize:
      - "Variation visuelle DSFR du focus si elle reste perceptible et conforme."
    accessible_correction: "Focus visible DSFR conservé sur boutons, liens/cartes, accordéons et modale ; ordre de tabulation logique ; aucun piège clavier ; comportement clavier des accordéons et de la modale conforme aux fiches DSFR."
    help:
      hint: "Laisser la souris de côté et parcourir toute la page avec Tab, Shift+Tab, Entrée et Espace. À chaque arrêt, demander : où suis-je, quelle action puis-je lancer, puis-je revenir en arrière ?"
      problem: "Le focus disparaît sur plusieurs composants interactifs. La personne qui navigue au clavier ne sait plus quelle commande, quelle carte ou quel accordéon est actif."
      findings_intro: "Les trois vérifications à mener sont :"
      findings:
        - "Visibilité : le focus doit être perceptible sur les boutons d'action, les cartes cliquables, les liens et les boutons d'accordéon."
        - "Atteignabilité : les actions visibles et activables à la souris doivent être atteignables au clavier."
        - "Ordre : le parcours Tab doit suivre l'ordre visuel et éditorial de la page, sans saut inattendu."
        - "Interaction : Entrée et Espace doivent permettre d'activer les boutons, d'ouvrir ou fermer les accordéons et de sortir d'une modale sans piéger le clavier."
      fix: "Retirer les surcharges CSS qui masquent le focus, remettre les actions prioritaires dans l'ordre de tabulation, conserver le comportement DSFR de la modale et tester chaque famille de composant au clavier."
      fixes_intro: "Corrections attendues par type de cas :"
      fixes:
        - "Boutons : les actions visibles doivent être focusables au clavier et aucun outline ou box-shadow de focus ne doit être supprimé par une règle locale."
        - "Cartes et liens : le lien actif doit afficher un état de focus visible et cohérent avec le DSFR."
        - "Accordéons : le bouton d'accordéon doit rester focusable, visible au focus et pilotable avec Entrée ou Espace."
        - "Modale : le bouton d'ouverture doit être un bouton focusable ; Échap doit refermer la modale ; Tab et Maj+Tab doivent circuler entre les éléments focusables internes sans bloquer la sortie par fermeture."
    dsfr_components:
      - "Carte"
      - "Bouton"
      - "Accordéon"
      - "Lien"

  - id: "ec07-language"
    number: 7
    title: "Déclarer les langues utilisées dans la page"
    realistic_context: "Annonce d'un atelier international avec plusieurs contenus en langue étrangère."
    easy_check:
      number: 7
      name: "Langue de la page"
    expected_minimal_finding: "La langue principale ou un changement de langue utile n'est pas déclaré correctement."
    minimal_proof: "Extrait HTML montrant lang absent, vide, invalide ou inadapté au contenu, ou contenu anglais non balisé."
    detection:
      - "Bookmarklet 08 Langue et direction"
      - "Web Developer"
      - "Validateur HTML du W3C"
      - "Tanaguru"
      - "Code source"
      - "WAVE"
    inaccessible_errors:
      - "Attribut lang invalide sur html."
      - "Contenu en anglais non balisé dans une page française."
      - "Code langue invalide sur un passage anglais."
      - "Paragraphe anglais déclaré avec lang=\"fr\" au lieu de lang=\"en\"."
    bonus_occurrences:
      - "Code langue erroné."
      - "Expression anglaise non balisée."
      - "Mauvaise régionalisation."
      - "Langue valide mais inadaptée au contenu."
    do_not_penalize:
      - "Noms propres et mots étrangers passés dans l'usage courant non balisés."
    accessible_correction: "lang fr sur la page ; codes langue ISO 639 valides ; contenus anglais avec lang en si nécessaire ; pas de sur-balisage des noms propres ou mots entrés dans l'usage courant."
    help:
      hint: "Inspecter la balise html, puis les expressions réellement rédigées dans une autre langue. Vérifier aussi que les codes utilisés sont des codes de langue, pas des noms complets ou des codes pays."
      problem: "La synthèse vocale ne sait pas quelle prononciation appliquer, ou applique une bascule de langue invalide ou inadaptée au contenu."
      findings_intro: "Les cinq cas à qualifier sont :"
      findings:
        - "Langue principale : la balise html utilise une valeur invalide au lieu de lang=\"fr\"."
        - "Expression anglaise non balisée : « Fall / Winter accessibility workshop » reste dans le flux français."
        - "Code invalide : lang=\"us\" désigne un pays, pas une langue ; le code attendu est lang=\"en\"."
        - "Langue inadaptée : le paragraphe en anglais est déclaré avec lang=\"fr\" au lieu de lang=\"en\"."
        - "Faux ami : weekend, newsletter et e-mail sont des mots passés dans l'usage courant et ne doivent pas être balisés en anglais."
      fix: "Déclarer la langue principale avec lang=\"fr\", baliser les vrais contenus étrangers avec des codes ISO 639 valides, vérifier que la langue déclarée correspond au contenu et éviter le sur-balisage des mots courants."
      fixes_intro: "Corrections attendues par cas :"
      fixes:
        - "Balise html : remplacer la valeur invalide par lang=\"fr\"."
        - "Contenus anglais : entourer les expressions anglaises utiles avec span lang=\"en\"."
        - "Code langue : remplacer lang=\"us\" par lang=\"en\"."
        - "Paragraphe anglais : remplacer lang=\"fr\" par lang=\"en\"."
        - "Mots courants : ne pas ajouter lang=\"en\" sur weekend, newsletter et e-mail."
    dsfr_components:
      - "Carte"
      - "Lien"
      - "Mise en avant"

  - id: "ec08-zoom"
    number: 8
    title: "Ressources à zoomer"
    realistic_context: "Page de ressources avec grille de cartes RGAA."
    easy_check:
      number: 8
      name: "Zoom à 200 %"
    expected_minimal_finding: "À 200 % de zoom ou avec l'espacement du texte renforcé, une carte perd du contenu ou devient difficilement utilisable."
    minimal_proof: "Capture à 200 % ou avec le bookmarklet 10.12 montrant texte tronqué, bouton sorti, superposition ou défilement horizontal non nécessaire."
    detection:
      - "Zoom navigateur 200 %"
      - "Fenêtre étroite"
      - "Bookmarklet 10.12 Espacement"
    inaccessible_errors:
      - "Cartes avec hauteur fixe."
      - "Grille avec largeur minimale rigide qui force un défilement horizontal."
      - "Overflow masqué provoquant texte tronqué, boutons sortis ou superposition au zoom 200 %."
    bonus_occurrences:
      - "Plusieurs cartes cassées."
      - "Hauteur fixe."
      - "overflow hidden."
    do_not_penalize:
      - "Reflow vertical normal et augmentation de hauteur des cartes."
    accessible_correction: "Cartes DSFR fluides ; grille responsive ; contenu visible ; reflow et espacement du texte sans perte ; composants utilisables."
    help:
      hint: "Passer le navigateur à 200 %, réduire la largeur de fenêtre, puis activer le bookmarklet 10.12 Espacement."
      problem: "Les cartes cassent au zoom ; les personnes malvoyantes ou sur petits écrans perdent du contenu et doivent faire défiler horizontalement la page."
      findings_intro: "Les trois symptômes à rechercher sont :"
      findings:
        - "Hauteur fixe : une carte ne grandit pas avec son contenu quand le texte grossit."
        - "Largeur rigide : la grille impose une largeur minimale et fait apparaître un défilement horizontal inutile."
        - "Contenu masqué : le texte, les détails ou les actions peuvent être tronqués par overflow hidden."
      fix: "Retirer les hauteurs et largeurs minimales fixes, éviter overflow hidden, utiliser la grille DSFR et tester à 200 % puis avec un espacement du texte renforcé."
      fixes_intro: "Corrections attendues :"
      fixes:
        - "Laisser les cartes adapter leur hauteur au contenu."
        - "Utiliser la grille DSFR responsive sans largeur minimale rigide."
        - "Tester à 200 % puis avec le bookmarklet 10.12 Espacement, et vérifier que les liens, boutons et textes restent lisibles et activables."
    dsfr_components:
      - "Carte"
      - "Lien"
      - "Bouton"

  - id: "ec09-captions"
    number: 9
    title: "Vidéo de sensibilisation"
    realistic_context: "Courte vidéo de sensibilisation à l'accessibilité numérique."
    easy_check:
      number: 9
      name: "Sous-titres vidéo"
    expected_minimal_finding: "La vidéo ne propose pas de sous-titres exploitables pour le contenu oral."
    minimal_proof: "Vérification du lecteur : absence de piste, bouton sous-titres absent, ou sous-titres automatiques non relus signalés."
    detection:
      - "Lecteur vidéo"
      - "Bouton sous-titres"
      - "Écoute sans son"
    inaccessible_errors:
      - "Vidéo sans sous-titres."
      - "Sous-titres automatiques non relus."
    bonus_occurrences:
      - "Sous-titres non synchronisés."
      - "Sons utiles non indiqués."
    do_not_penalize:
      - "Vidéo strictement décorative sans information orale utile, si elle est correctement ignorée ou décrite ailleurs."
    accessible_correction: "Sous-titres synchronisés, relus, ponctués, avec sons utiles."
    help:
      hint: "Lire la vidéo sans le son et vérifier la présence d'une piste de sous-titres exploitable."
      problem: "Le contenu oral est indisponible sans son."
      findings_intro: "Les trois contrôles à mener sont :"
      findings:
        - "Piste présente : le lecteur doit proposer une piste de sous-titres activable."
        - "Qualité : les sous-titres automatiques non relus ne suffisent pas pour publier."
        - "Contenu utile : les paroles, noms propres, acronymes, chiffres et sons importants doivent être correctement restitués."
      fix: "Fournir un fichier VTT relu, synchronisé et activable depuis le lecteur."
      fixes_intro: "Corrections attendues :"
      fixes:
        - "Ajouter une piste VTT déclarée avec track kind=\"captions\"."
        - "Relire et corriger les sous-titres automatiques avant publication."
        - "Synchroniser les sous-titres et ajouter les indications sonores utiles."
    dsfr_components:
      - "Contenu médias"
      - "Transcription"
      - "Lien"
    assets:
      placeholders:
        - "assets/video/captcha-le-retour-au-moyen-age.mp4"
        - "assets/shared/media/sous-titres-demo.vtt"
      final_assets_pending: true

  - id: "ec10-transcript"
    number: 10
    title: "Écouter un podcast"
    realistic_context: "Extrait audio présentant une démarche RGAA."
    easy_check:
      number: 10
      name: "Transcriptions audio et vidéo"
    expected_minimal_finding: "Le contenu audio n'a pas de transcription accessible à proximité."
    minimal_proof: "Revue de la page montrant absence de lien de transcription proche du média."
    detection:
      - "Revue humaine"
      - "Inspection des liens proches du média"
    inaccessible_errors:
      - "Audio sans lien visible vers une transcription."
    bonus_occurrences:
      - "Transcription incomplète."
      - "Lien peu explicite."
      - "Transcription non structurée."
    do_not_penalize:
      - "Résumé éditorial court en complément, s'il existe aussi une transcription complète."
    accessible_correction: "Lien proche du média vers une transcription structurée et complète."
    help:
      hint: "Chercher un lien de transcription immédiatement proche du lecteur audio."
      problem: "Le contenu audio n'est pas disponible en texte."
      findings_intro: "Les trois questions à poser sont :"
      findings:
        - "Le lien ou bouton « Lire la transcription » est-il visible près du média ?"
        - "La transcription reprend-elle tout le contenu utile, et pas seulement un résumé ?"
        - "La transcription est-elle structurée pour être relue, copiée ou citée facilement ?"
      fix: "Ajouter une transcription accessible, complète, structurée et liée près du média."
      fixes_intro: "Corrections attendues :"
      fixes:
        - "Placer un accès visible à la transcription immédiatement après le lecteur audio."
        - "Fournir une transcription complète des paroles et informations sonores essentielles."
        - "Structurer la transcription avec un titre et des paragraphes lisibles."
    dsfr_components:
      - "Contenu médias"
      - "Transcription"
      - "Lien"
    assets:
      placeholders:
        - "assets/audio/narration-complete.mp3"
        - "assets/shared/media/transcription-demo.html"
      final_assets_pending: true

  - id: "ec11-audio-description"
    number: 11
    title: "Démonstration vidéo"
    realistic_context: "Vidéo montrant une interface avant/après ou un geste de correction."
    easy_check:
      number: 11
      name: "Audiodescription"
    expected_minimal_finding: "Une information visuelle essentielle n'est pas disponible autrement que par l'image."
    minimal_proof: "Revue humaine de la vidéo montrant une action ou information visuelle non décrite dans l'audio ni dans une version alternative."
    detection:
      - "Revue humaine de la vidéo"
      - "Comparaison audio / information visuelle"
    inaccessible_errors:
      - "Information visuelle essentielle non décrite dans l'audio principal."
      - "Absence de piste ou version audiodécrite."
    bonus_occurrences:
      - "Absence de version audiodécrite."
      - "Description trop vague."
      - "Lien vers version décrite absent."
    do_not_penalize:
      - "Vidéo où toutes les informations visuelles essentielles sont déjà dites dans l'audio."
    accessible_correction: "Description intégrée, piste audiodécrite ou version alternative selon faisabilité."
    help:
      hint: "Commencer par la présence : la vidéo propose-t-elle une piste de sous-titres, une transcription proche du lecteur et une version ou piste audiodécrite ? Ensuite seulement, juger leur pertinence."
      problem: "La page à auditer publie une vidéo sans les trois alternatives attendues. La présence est donc non conforme ; la pertinence des alternatives absentes devient non applicable pour cette occurrence."
      findings_intro: "Les trois contrôles à mener sont :"
      findings:
        - "Sous-titres : la piste doit exister dans le lecteur, puis son contenu doit être relu, synchronisé et utile."
        - "Transcription : l'accès doit être placé près de la vidéo, puis le texte doit permettre de comprendre le contenu sans lancer le média."
        - "Audiodescription : une version ou piste dédiée doit exister si l'image porte une information essentielle, puis elle doit décrire précisément ce qui est nécessaire à la compréhension."
      fix: "Ajouter les alternatives manquantes, puis vérifier leur pertinence une par une. Ne pas juger la qualité d'une alternative qui n'existe pas : le critère de pertinence associé est non applicable."
      fixes_intro: "Corrections attendues :"
      fixes:
        - "Ajouter une piste de sous-titres WebVTT en français issue de la source vidéo."
        - "Placer un composant de transcription immédiatement après la vidéo."
        - "Fournir la version audiodécrite locale quand l'image porte une information essentielle."
        - "Contrôler séparément présence et pertinence pour éviter de noter deux fois la même absence."
    dsfr_components:
      - "Contenu médias"
      - "Transcription"
      - "Lien"
    assets:
      placeholders:
        - "assets/video/captcha-le-retour-au-moyen-age.mp4"
        - "assets/shared/media/captcha-sous-titres.vtt"
        - "assets/shared/media/captcha-le-retour-au-moyen-age-youtube.fr.srt"
        - "assets/shared/media/captcha-le-retour-au-moyen-age-youtube.fr.vtt"
        - "assets/shared/media/audiodescription-demo.vtt"
        - "assets/video/captcha-le-retour-au-moyen-age-audiodecrite.mp4"
      final_assets_pending: true
      external_sources:
        with_transcription:
          title: "Valentin Haüy - CAPTCHA : le retour au Moyen Âge"
          url: "https://www.youtube.com/watch?v=nSZ0xeXapds"
          embed_url: "https://www.youtube-nocookie.com/embed/nSZ0xeXapds"
          role: "Vidéo de sensibilisation avec transcription disponible sur YouTube."
        audio_described:
          title: "CAPTCHA : le retour au Moyen Âge (vidéo audiodécrite)"
          url: "https://www.youtube.com/watch?v=trfLb7xlXjQ"
          embed_url: "https://www.youtube-nocookie.com/embed/trfLb7xlXjQ"
          role: "Version audiodécrite de la vidéo de sensibilisation."
      rights_note: "Ne pas télécharger ni réhéberger sans vérification des droits. Utiliser ces liens comme sources pédagogiques ou remplacer par fichiers locaux autorisés."

  - id: "ec12-form-labels"
    number: 12
    title: "Inscription à un webinaire"
    realistic_context: "Formulaire d'inscription à un webinaire RGAA."
    easy_check:
      number: 12
      name: "Étiquettes de formulaire"
    expected_minimal_finding: "Au moins un champ ou groupe de champs n'a pas de nom accessible fiable."
    minimal_proof: "ANDI/WAVE, clic label ou extrait HTML montrant placeholder seul, label non associé ou groupe DSFR visuel sans fieldset/legend natifs."
    detection:
      - "ANDI"
      - "WAVE"
      - "Clic sur le label"
      - "Test clavier"
      - "DevTools Accessibility Tree"
      - "Lecteur d'écran si disponible"
    inaccessible_errors:
      - "Placeholder utilisé comme seule étiquette."
      - "Étiquette visible non associée au champ."
      - "Groupe de boutons radio ou cases à cocher présenté avec des classes DSFR mais sans fieldset/legend natifs."
    bonus_occurrences:
      - "Nom visible différent du nom accessible."
      - "Aide non reliée."
      - "Label masqué avec display none."
    do_not_penalize:
      - "Placeholder utilisé comme exemple si une étiquette visible et associée existe."
    accessible_correction: "Étiquette visible et persistante ; association label for/id ; placeholder utilisé seulement comme exemple ; nom accessible qui reprend le nom visible ; aide à la saisie reliée avec aria-describedby ; groupes DSFR structurés avec fieldset.fr-fieldset, legend.fr-fieldset__legend, `fr-fieldset__element` et fr-messages-group."
    help:
      hint: "Vérifier uniquement le nom accessible des champs et des groupes avec ANDI, WAVE ou l'arbre d'accessibilité. Tester aussi le clic sur les libellés visibles. Les champs obligatoires et les erreurs seront traités dans le point 13."
      problem: "Le champ ou le groupe n'a pas de nom fiable : lecteur d'écran muet, commande vocale fragile, mémoire sollicitée ou contexte perdu. L'objectif est de distinguer l'étiquette du champ de la validation du formulaire."
      findings_intro: "Les trois familles d'erreurs à repérer sont :"
      findings:
        - "Champ de saisie : le nom de famille utilise le placeholder comme seule étiquette."
        - "Champ de saisie : l'étiquette de l'adresse électronique est visible, mais son attribut for ne cible pas l'id du champ."
        - "Choix : les boutons radio et les cases à cocher sont présentés visuellement comme des groupes DSFR, mais sans fieldset et legend natifs."
      fix: "Relier chaque étiquette au champ, ne pas remplacer le label par un placeholder, structurer les groupes avec les composants DSFR natifs et vérifier le nom accessible avant de traiter les erreurs de saisie."
      fixes_intro: "Corrections DSFR attendues :"
      fixes:
        - "Utiliser div.fr-input-group, label.fr-label for/id, input.fr-input et fr-messages-group relié par aria-describedby."
        - "Regrouper les boutons radio dans fieldset.fr-fieldset avec legend.fr-fieldset__legend et des éléments `fr-fieldset__element`."
        - "Regrouper les cases à cocher dans fieldset.fr-fieldset avec une légende explicite et des messages de groupe."
    dsfr_components:
      - "Formulaire"
      - "Champ de saisie"
      - "Case à cocher"
      - "Bouton radio"
      - "Bouton"

  - id: "ec13-required-errors"
    number: 13
    title: "Formulaire de contact"
    realistic_context: "Formulaire de contact pour poser une question sur l'accessibilité numérique ou signaler une difficulté."
    easy_check:
      number: 13
      name: "Champs obligatoires et erreurs"
    expected_minimal_finding: "L'obligation ou l'erreur de saisie n'est pas annoncée et reliée de manière exploitable."
    minimal_proof: "Soumission du formulaire et inspection HTML montrant obligation non balisée, message vague/non relié ou focus non accompagné."
    detection:
      - "Soumission du formulaire"
      - "Clavier"
      - "Lecteur d'écran"
      - "Inspection HTML"
      - "Vérification aria-describedby"
      - "Vérification aria-invalid"
      - "Vérification required"
      - "Déplacement de focus"
    scenario:
      before_submit: "Vérifier l'état initial : les champs obligatoires du formulaire de contact doivent être annoncés avant l'envoi, sans afficher d'erreur prématurée."
      after_submit: "Soumettre le formulaire vide, puis vérifier l'aide à la correction : message précis, relié au champ, et focus accompagné."
    inaccessible_errors:
      - "Champs obligatoires indiqués uniquement par couleur, bordure rouge ou astérisque non expliqué."
      - "Absence de required ou aria-required."
      - "Message d'erreur trop vague."
      - "Message d'erreur non associé au champ."
      - "Focus non ramené vers le récapitulatif ou le premier champ en erreur."
    bonus_occurrences:
      - "Absence de required/aria-required."
      - "Erreur sans aria-describedby."
      - "aria-invalid absent si pertinent."
    do_not_penalize:
      - "Astérisque utilisé s'il est expliqué et complété par une information technique et textuelle."
    accessible_correction: "Mention textuelle obligatoire ou règle claire sur les champs optionnels ; required ou aria-required ; astérisque expliqué si utilisé ; message d'erreur précis avec exemple ou format attendu ; erreur associée au champ ; aria-invalid true si pertinent ; focus placé sur le récapitulatif d'erreurs ou le premier champ en erreur."
    help:
      hint: "Observer d'abord le formulaire avant envoi, puis le soumettre vide. Comparer l'état initial et l'état après soumission. Ici, les libellés doivent déjà être compréhensibles : le test porte sur l'obligation, les messages et le guidage après erreur."
      problem: "L'obligation n'est pas annoncée ou la correction n'est pas accompagnée : perte de contexte, erreurs répétées et abandon."
      findings_intro: "Les cinq points à vérifier sont :"
      findings:
        - "État initial : le formulaire de contact ne doit pas afficher d'erreur avant que l'utilisateur soumette."
        - "Prévention : les champs nom, courriel et message ne doivent pas être signalés seulement par une couleur ou un astérisque inexpliqué."
        - "Technique : les champs requis doivent porter required ou aria-required selon le cas."
        - "Message : après soumission, l'erreur doit nommer le champ concerné et expliquer la correction attendue."
        - "Association et parcours : le message d'erreur doit être relié au champ avec aria-describedby et le focus doit accompagner l'utilisateur vers le récapitulatif ou le premier champ en erreur."
      fix: "Prévenir avant soumission, expliquer après soumission, relier techniquement les erreurs et guider le focus."
      fixes_intro: "Corrections attendues :"
      fixes:
        - "Indiquer clairement la règle des champs obligatoires avant le formulaire de contact."
        - "Ajouter required ou aria-required sur le nom, le courriel et le message."
        - "Afficher les erreurs seulement après soumission."
        - "Rédiger des messages d'erreur précis et les associer aux champs."
        - "Utiliser aria-invalid=\"true\" quand le champ est en erreur et guider le focus vers le récapitulatif."
    dsfr_components:
      - "Formulaire"
      - "Champ de saisie"
      - "Alerte"
      - "Bouton"

